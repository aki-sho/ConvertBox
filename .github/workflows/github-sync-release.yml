name: GitHub sync verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content portable/bin/ffmpeg-runtime.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-runtime.7z'
          Invoke-WebRequest -Uri $m.archiveUrl -OutFile $archive -TimeoutSec 180
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $m.archiveSha256) { throw 'FFmpeg archive hash mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-runtime'
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive ('-o'+$extract) -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg extraction failed' }
          $folder = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) { Copy-Item -LiteralPath (Join-Path $folder.FullName ('bin\'+$name)) -Destination (Join-Path 'portable/bin' $name) }
          & 'npm.cmd' 'run' 'check'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          & 'npm.cmd' 'run' 'check:security'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          & 'npm.cmd' 'run' 'check:runtime'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          & 'npm.cmd' 'run' 'check:video'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          & 'npm.cmd' 'run' 'check:audio'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          & 'npm.cmd' 'run' 'check:image'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          & 'npm.cmd' 'run' 'release:portable'
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging step failed' }
          $out = 'github-sync-distribution'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($dir in @('dist','dist-unsigned')) { if (Test-Path -LiteralPath $dir) { Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '\.(exe|zip|sha256|cer|txt)$' } | Copy-Item -Destination $out } }
          $binaries = @(Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension -in @('.exe','.zip') })
          if ($binaries.Count -eq 0) { throw 'No distribution binaries were produced' }
          foreach ($file in $binaries) { $hash=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); [IO.File]::WriteAllText(($file.FullName+'.sha256'), $hash+'  '+$file.Name+[Environment]::NewLine, [Text.Encoding]::ASCII) }
          $items = @(Get-ChildItem -LiteralPath $out -File | ForEach-Object { @{name=$_.Name;size=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          @{app='FileConverter';version='1.3.2';commit=$env:GITHUB_SHA;repository=$env:GITHUB_REPOSITORY;run=$env:GITHUB_RUN_ID;files=$items} | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $out 'release-build.json') -Encoding utf8
      - name: Upload verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-sync-distribution
          path: github-sync-distribution/
          if-no-files-found: error
          retention-days: 14
